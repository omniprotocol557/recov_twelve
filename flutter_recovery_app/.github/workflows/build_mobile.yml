name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files
        working-directory: ./flutter_recovery_app
        run: flutter create --platforms=android,ios --org=com.recovery .

      - name: Fix Gradle Distribution URL
        working-directory: ./flutter_recovery_app
        run: |
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|github.com/gradle/gradle-distributions/releases/download|services.gradle.org/distributions|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install Dependencies
        working-directory: ./flutter_recovery_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./flutter_recovery_app
        run: |
          flutter build apk --debug || (sleep 10 && flutter build apk --debug)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: flutter_recovery_app/build/app/outputs/flutter-apk/*.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files
        working-directory: ./flutter_recovery_app
        run: flutter create --platforms=android,ios --org=com.recovery .

      - name: Install Dependencies
        working-directory: ./flutter_recovery_app
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        working-directory: ./flutter_recovery_app
        run: |
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -destination 'generic/platform=iOS' build
          cd ..

      - name: Package Payload / IPA
        working-directory: ./flutter_recovery_app
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r recovery_ios_app.ipa Payload
            zip -r Runner.app.zip "$APP_PATH"
          else
            echo "Runner.app not found, skipping IPA packaging"
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Package
          path: |
            flutter_recovery_app/recovery_ios_app.ipa
            flutter_recovery_app/Runner.app.zip
