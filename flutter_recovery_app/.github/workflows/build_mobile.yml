name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files
        working-directory: ./flutter_recovery_app
        run: flutter create --platforms=android,ios --org=com.recovery .

      - name: Install Dependencies
        working-directory: ./flutter_recovery_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: ./flutter_recovery_app
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: flutter_recovery_app/build/app/outputs/flutter-apk/*.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Platform Files
        working-directory: ./flutter_recovery_app
        run: flutter create --platforms=android,ios --org=com.recovery .

      - name: Install Dependencies
        working-directory: ./flutter_recovery_app
        run: flutter pub get

      - name: Build iOS
        working-directory: ./flutter_recovery_app
        run: flutter build ios --release --no-codesign

      - name: Package Payload / IPA
        working-directory: ./flutter_recovery_app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r recovery_ios_app.ipa Payload
          zip -r Runner.app.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Package
          path: |
            flutter_recovery_app/recovery_ios_app.ipa
            flutter_recovery_app/Runner.app.zip
