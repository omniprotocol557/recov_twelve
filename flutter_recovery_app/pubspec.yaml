name: recovery_app
description: "تطبيق التعافي واليقظة الروحية - الخطوة العاشرة والمراجعة اليومية"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Utilities
  intl: ^0.19.0
  path_provider: ^2.1.2
  url_launcher: ^6.2.5

  # Offline Encrypted Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Native Biometrics (Face ID, Fingerprint)
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
